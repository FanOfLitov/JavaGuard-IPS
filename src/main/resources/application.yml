spring:
  datasource:
    url: ${JAVAGUARD_DB_URL:jdbc:postgresql://localhost:5434/javaguard}
    username: ${JAVAGUARD_DB_USER:javaguard}
    password: ${JAVAGUARD_DB_PASSWORD:javaguard}

  jpa:
    hibernate:
      ddl-auto: update

    open-in-view: false

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  server:
    port: ${JAVAGUARD_SERVER_PORT:8090}